databases:
  - name: cas-talent-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cas-talent-platform
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cas-talent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
